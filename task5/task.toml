version = "2.0"

[metadata]
category = "Kernel Structural Correctness"
secondary_categories = ["Tensor / Memory Layout"]
tags = ["pytorch", "triton", "gpu-kernels", "addressing", "strides", "caching", "int64-indexing"]
difficulty = "hard"
difficulty_explanation = """
Two silent independent defects sit in two different files, and neither can be
diagnosed by reading the file it lives in.

The kernel builds its offset out of two halves and casts both to 64 bit before
adding them, with a comment saying as much, so wide addressing looks handled.
The cast on the second half lands one step too late: lane comes from tl.arange,
which Triton types as int32, and the column pitch is an int32 argument, so the
product has already wrapped before it is widened. This defeats the reflex
repair, because an agent that blanket-casts offset arithmetic to int64 finds a
cast on every term already and changes nothing. The product wraps only when the
column pitch is large, and the column pitch is only large when the table is
addressed down a column rather than along a row.
So the trigger is a conjunction: big enough that a pitch times an index crosses
2^31, and laid out so that the big pitch is the one multiplied by the lane. A
large contiguous table is fine, a small transposed table is fine, and a large
transposed table quietly loses the last fraction of a percent of every row.
Nothing in the package widens a lane index anywhere else, so there is no
correct exemplar to copy and no diff that hands over the answer: the two sibling
kernels declare that they need a packed trailing axis and walk a row with a
plain add, which is a real, validated restriction rather than a contrivance.

The second defect is a memoised access plan whose key is shape, dtype, device,
contiguity, the trailing axis pitch, and config. A stride is genuinely in that
key, so "the key ignores layout" is a false reading: it separates a packed table
from a view, and a transpose or column slice from either. What it misses is two
unpacked views of each other's shape whose trailing axis is packed in both, which
agree on every element of the key and differ on the leading pitch, so the second
table gathered is served the first one's pitches. This is the more findable of
the two, stated plainly: a reader who lists the key's elements against what
build_plan consumes can see the leading pitch is missing, and a solver agent
given only the contract did exactly that on a first attempt. It stays in because
the suite is graded whole, so it is a second thing that has to be understood, and
observing it still needs a deliberate sequence of calls over two tables that any
layout-by-layout probe misses. The width defect carries the difficulty.

Nothing raises, nothing warns, and every shape and dtype is right throughout.
The pass_to_pass set rewards the wrong hypotheses: size alone is fine, layout
alone is fine, each view alone is fine, and probing whether state leaks between
a packed and an unpacked table of the same shape comes back clean. A decoy
repair is available too, since row ids are narrowed to int32 in a third file,
which looks like the cause of an overflow but is not.
"""
solution_explanation = """
The first fix moves one cast inside a parenthesis, widening the lane index before
it is multiplied by the column pitch rather than after, so the offset within a
row is computed in 64 bit instead of wrapping and then being sign extended. The
second replaces the trailing axis pitch in the plan cache key with the full
stride tuple, which is what the plan is actually derived from.
Neither fix changes a signature and neither touches the two sibling kernels.
"""
verification_explanation = """
For fail_to_pass: gathering from a table that is both large and addressed down a
column, checked against torch's advanced indexing, against torch.index_select,
against a loop that fetches each row on its own, and once more through a
doubly strided view of the same allocation; plus four sequence cases where a
gather from one unpacked view is preceded by a gather from another unpacked view
of the same shape and a different pitch, in both orders, over a mixed run of
three pitches, and over two views carved out of a single allocation.
For pass_to_pass: a large contiguous table, a small transposed table, a column
step sliced table, a row step sliced table, and each unpacked view on its own,
all already correct; a packed gather followed by an unpacked gather of equal
shape; an unpacked gather preceded by one of a different shape; repeated gathers
from one table; the output's shape, dtype, device and contiguity contract; both
index dtypes; the block_size knob changing no value; both sibling kernels,
including the row sum kernel on the same full size table; the packed trailing
axis requirement still raising; an out of range row id still raising; the plan
cache still inspectable and clearable; and the registry still exposing three
names.
No comparison is made against this package's own output, so editing the library
cannot make a wrong answer look right. One pass_to_pass test swaps the compiled
kernel for a tripwire and asserts the gather still launches it, so replacing the
kernel with torch indexing cannot pass the suite either. An autouse fixture
empties the plan cache around every test, so only the tests that are about a
sequence of calls ever see one.
One allocation of 840000 by 2560 int8 (2.003 GiB) backs every full size case and
its transpose is the second layout over the same bytes; the suite needs roughly
2.5 GiB of free device memory.
"""
expert_time_estimate_hours = 7.5

[verifier]
timeout_sec = 2400

[agent]
timeout_sec = 2400

[environment]
build_timeout_sec = 1800
cpus = 4
gpus = 1
memory_mb = 16384
storage_mb = 16384
